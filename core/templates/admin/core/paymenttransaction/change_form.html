{% extends "admin/change_form.html" %}

{% block submit_buttons_bottom %}
  {{ block.super }}

  {% if original and original.status == "pending" %}
    <div style="margin-top:16px;padding:18px;border:1px solid #d9e2ec;border-radius:12px;background:#f8fafc;">
      <strong style="display:block;margin-bottom:12px;font-size:16px;">Payment Review</strong>

      <button type="submit"
              name="_review"
              value="approve"
              style="background:#16a34a;color:white;border:0;padding:10px 18px;border-radius:7px;font-weight:600;cursor:pointer;">
        Approve Payment
      </button>

      <button type="submit"
              name="_review"
              value="reject"
              style="background:#dc2626;color:white;border:0;padding:10px 18px;margin-left:10px;border-radius:7px;font-weight:600;cursor:pointer;">
        Reject Payment
      </button>

      <p style="margin:12px 0 0;color:#64748b;">
        For rejection, enter the reason in <strong>Admin note</strong> above.
      </p>
    </div>
  {% endif %}
{% endblock %}
